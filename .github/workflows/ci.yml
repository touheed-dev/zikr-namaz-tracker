name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Commit web/package-lock.json after your first `npm install` and switch this to `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  sql:
    name: SQL tests (plain Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: ./supabase/tests/run.sh --fresh
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

  e2e:
    name: End-to-end (supabase start + Playwright)
    runs-on: ubuntu-latest
    needs: [web, sql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Point the app at the local stack
        run: |
          supabase status -o env > /tmp/supa.env
          source /tmp/supa.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } > web/.env.local
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: SQL tests against the Supabase stack
        run: ./supabase/tests/run.sh
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
