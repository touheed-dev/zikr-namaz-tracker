<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Zikr &amp; Namaz</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E1B17; color: #F4EFE6;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center; }
    .card { background: #16302A; border-radius: 20px; padding: 28px 24px; max-width: 380px; }
    h1 { font-family: Georgia, serif; font-weight: 600; margin: 0 0 8px; }
    p { color: #A9BDB5; margin: 0 0 18px; line-height: 1.5; }
    .btn { display: inline-block; text-decoration: none; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 0; background: #1A7F45; color: #F4EFE6; font-weight: 600; font-size: 15px; }
    .btn:focus-visible { outline: 3px solid #E9C46A; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You are offline</h1>
    <p>Your prayers are saved on the server, so this app needs a connection to load. Reconnect and try again.</p>
    <a class="btn" href="/">Try again</a>
  </main>
</body>
</html>
